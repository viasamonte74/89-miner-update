; supervisord -c miner_ext/ops/supervisord.conf
; Grow tick archive continuously. Retrain is manual / cron (see train/README.md).

[unix_http_server]
file=/tmp/sn89_miner_ext_supervisor.sock

[supervisord]
logfile=/workspace/logs/supervisord_miner_ext.log
pidfile=/tmp/sn89_miner_ext_supervisord.pid
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/sn89_miner_ext_supervisor.sock

[program:tick_archiver]
command=/venv/main/bin/python -m miner_ext.data.tick_archiver --loop --interval-s 180 --workers 2 --sleep 0.02
directory=/workspace/InfiniteQuant-Subnet
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/workspace/logs/tick_archiver.log
redirect_stderr=true
environment=PYTHONPATH="/workspace/InfiniteQuant-Subnet",SN89_DATA_ROOT="/workspace/sn89_data",WORKSPACE="/workspace"
